# Builds, tests and publishes the app to GitHub Pages on every push to main.
# The site is served from the gh-pages branch:
#   https://mariocoleguilla.github.io/mortgageCalculator/

name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  # Allows a manual redeploy from the Actions tab
  workflow_dispatch:

# Never run two deployments at the same time; a newer push wins
concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write # push to the gh-pages branch

env:
  # Pages serves the repository under /<repo-name>/
  BASE_HREF: /mortgageCalculator/
  BUILD_DIR: dist/mortgageCalculator/browser

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm run test:ci

    - name: Build for production
      run: npm run build -- --base-href "$BASE_HREF"

    - name: Prepare static files for Pages
      run: |
        # SPA fallback: unknown paths load the app instead of GitHub's 404 page
        cp "$BUILD_DIR/index.html" "$BUILD_DIR/404.html"
        # Serve files starting with "_" as-is (skip Jekyll processing)
        touch "$BUILD_DIR/.nojekyll"

    - name: Checkout gh-pages branch
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: gh-pages

    - name: Publish to gh-pages
      env:
        # Passed through env (not inlined) so the message can't break the script
        COMMIT_MSG: ${{ github.event.head_commit.message || 'manual deploy' }}
      run: |
        # Replace the published files, keeping the branch history (allows rollbacks)
        cd gh-pages
        git rm -rq --ignore-unmatch .
        cp -a "$GITHUB_WORKSPACE/$BUILD_DIR/." .
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "No changes to publish."
          exit 0
        fi
        git commit -m "Deploy ${GITHUB_SHA::7}: ${COMMIT_MSG%%$'\n'*}"
        git push origin gh-pages

    - name: Summary
      run: echo "Published to https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
