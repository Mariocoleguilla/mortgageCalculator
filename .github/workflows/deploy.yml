# Builds, tests and publishes the app to GitHub Pages on every push to main.
#   https://mariocoleguilla.github.io/mortgageCalculator/
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The site is uploaded as an artifact; no gh-pages branch is needed.

name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  # Allows a manual (re)deploy from the Actions tab
  workflow_dispatch:

# Only one deployment at a time; never cancel one that is already publishing
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write    # deploy to Pages
  id-token: write # verify the deployment comes from this repository

env:
  # Pages serves the repository under /<repo-name>/
  BASE_HREF: /mortgageCalculator/
  BUILD_DIR: dist/mortgageCalculator/browser

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm run test:ci

    - name: Build for production
      run: npm run build -- --base-href "$BASE_HREF"

    - name: Prepare static files for Pages
      run: |
        # SPA fallback: unknown paths load the app instead of GitHub's 404 page
        cp "$BUILD_DIR/index.html" "$BUILD_DIR/404.html"
        # Serve files as-is (skip Jekyll processing)
        touch "$BUILD_DIR/.nojekyll"

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ env.BUILD_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
